<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container py-5">
    <h1 class="block-heading text-center mb-5">Shopping Cart</h1>
    <div class="row g-4">
      <main class="col-lg-8">
        <h2 class="mb-4">Your Products</h2>
        <section class="product card mb-3 p-3">
          <div class="row align-items-center g-3">
            <div class="col-3"><img class="img-fluid rounded" src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=240" alt="Classic wristwatch"></div>
            <div class="col-6"><h3>Classic Watch</h3><p class="text-muted mb-0">Minimal everyday style</p></div>
            <div class="col-3 text-end"><strong>$49.00</strong></div>
          </div>
        </section>
        <section class="product card mb-3 p-3">
          <div class="row align-items-center g-3">
            <div class="col-3"><img class="img-fluid rounded" src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=240" alt="Wireless headphones"></div>
            <div class="col-6"><h3>Wireless Headphones</h3><p class="text-muted mb-0">Rich sound, all day</p></div>
            <div class="col-3 text-end"><strong>$79.00</strong></div>
          </div>
        </section>
        <section class="product card mb-3 p-3">
          <div class="row align-items-center g-3">
            <div class="col-3"><img class="img-fluid rounded" src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=240" alt="Instant camera"></div>
            <div class="col-6"><h3>Instant Camera</h3><p class="text-muted mb-0">Capture the moment</p></div>
            <div class="col-3 text-end"><strong>$89.00</strong></div>
          </div>
        </section>
      </main>
      <aside class="col-lg-4">
        <div class="summary card p-4">
          <h2>Price Summary</h2>
          <div class="d-flex justify-content-between py-3 border-bottom"><span>Subtotal</span><span>$217.00</span></div>
          <div class="d-flex justify-content-between py-3 border-bottom"><span>Shipping</span><span>Free</span></div>
          <div class="d-flex justify-content-between py-3 fw-bold"><span>Total</span><span>$217.00</span></div>
          <button class="btn btn-primary w-100 mt-3" type="button">Continue to Checkout</button>
        </div>
      </aside>
    </div>
  </div>
  <script type="text/javascript" src="./script.js"></script>
</body>
</html>
